name: Build SafeTorrent (Android APK, Windows EXE, Linux)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit, security, and widget tests
        run: flutter test -r expanded

  build-android:
    name: Build Standalone Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner, app icon & SafeTorrent manifest
        run: |
          flutter create --platforms=android --org com.safetorrent --project-name safetorrent .
          python3 -m pip install --quiet pillow
          python3 installer/generate_icons.py --platform android
          python3 -c 'from pathlib import Path; m = Path("android/app/src/main/AndroidManifest.xml"); t = m.read_text(encoding="utf-8"); t = t.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application", 1) if "android.permission.INTERNET" not in t else t; m.write_text(t.replace("android:label=\"safetorrent\"", "android:label=\"SafeTorrent\""), encoding="utf-8")'

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk SafeTorrent-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeTorrent-Android-APK
          path: SafeTorrent-Android.apk

  build-windows:
    name: Build Standalone Windows EXE & Portable ZIP
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner, app icon & build Release EXE
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.safetorrent --project-name safetorrent .
          python -m pip install --quiet pillow
          python installer/generate_icons.py --platform windows
          flutter pub get
          flutter build windows --release

          # Bundle official Microsoft VC++ CRT DLLs (app-local) so Windows PCs without
          # Visual C++ Redistributable never hit "msvcp140.dll introuvable".
          $releaseDir = "build\windows\x64\runner\Release"
          $crtDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($crtDir) {
            Write-Host "Bundling VC++ CRT DLLs from $($crtDir.FullName)"
            Copy-Item "$($crtDir.FullName)\*.dll" -Destination $releaseDir -Force
          } else {
            foreach ($dll in @("msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
              $src = "C:\Windows\System32\$dll"
              if (Test-Path $src) {
                Copy-Item $src -Destination $releaseDir -Force
              }
            }
          }
          foreach ($req in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            if (-not (Test-Path "$releaseDir\$req")) {
              throw "Missing required VC++ runtime DLL: $req"
            }
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath SafeTorrent-Windows-Portable.zip

      - name: Package single-file Windows Setup EXE (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer\windows_setup.iss

      - name: Upload Windows EXE & Portable ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeTorrent-Windows-x64
          path: |
            SafeTorrent-Windows-Setup.exe
            SafeTorrent-Windows-Portable.zip

  build-linux:
    name: Build Standalone Linux App
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev python3-pil

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux runner, app icon & build Release bundle + DEB package
        run: |
          flutter create --platforms=linux --org com.safetorrent --project-name safetorrent .
          python3 installer/generate_icons.py --platform linux
          flutter pub get
          flutter build linux --release
          tar -czf SafeTorrent-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
          chmod +x installer/build_deb.sh
          bash installer/build_deb.sh 1.4.0

      - name: Upload Linux DEB & tar.gz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeTorrent-Linux-x64
          path: |
            SafeTorrent-Linux-amd64.deb
            SafeTorrent-Linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release (on tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SafeTorrent-Android.apk
            release-assets/SafeTorrent-Windows-Setup.exe
            release-assets/SafeTorrent-Windows-Portable.zip
            release-assets/SafeTorrent-Linux-amd64.deb
            release-assets/SafeTorrent-Linux-x64.tar.gz
          generate_release_notes: true
