name: safetorrent
description: "Application 100% autonome (Android APK, Windows, Linux) avec bac à sable anti-virus et intégration Seedr pour films et séries."
publish_to: 'none'
version: 1.6.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  html: ^0.15.4
  http: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
