name: safetorrent
description: "Application 100% autonome (Android APK, Windows, Linux) avec bac à sable anti-virus pour rechercher des fichiers .torrent de films."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  html: ^0.15.4
  http: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
